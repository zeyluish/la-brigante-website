<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      href="./assets/img/logo-la-brigante.jpeg"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="variables.css" />
    <link rel="stylesheet" href="index.css" />
    <title>La Brigante</title>
  </head>
  <body>
    <header>
      <section class="flash-info">
        <div class="container">
          <div class="row py-2">
            <div class="col-1"></div>
            <div class="col-10">
              Les voiles de Saint-Tropez du 28 septembre au 4 octobre - Places
              limitées
            </div>
            <div class="col-1"></div>
          </div>
          <div class="row pb-2">
            <div class="col-3 col-lg-4"></div>
            <div class="col-6 col-lg-4">
              <button>Réserver</button>
            </div>
            <div class="col-3 col-lg-4"></div>
          </div>
        </div>
      </section>
      <nav class="navbar navbar-expand-lg bg-body-light">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">
            <img
              src="./assets/img/logo-la-brigante.jpeg"
              alt="Logo de la Brigante"
              width="40"
              class="img-fluid logo-la-brigante"
            />
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul
              class="navbar-nav justify-content-lg-center w-100 mt-1 mt-lg-0 gap-lg-5"
            >
              <li class="nav-item">
                <a class="nav-link active px-3" aria-current="page" href="#"
                  >La Brigante</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link px-3" href="#">Nos Services</a>
              </li>
              <li class="nav-item">
                <a class="nav-link px-3" href="#">Contact</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>
    <main>
      <!-- <section class="hero">
        <div class="container">
          <div class="row mx-2">
            <div class="col-12 bloc-flou">
              <p>Texte par-dessus l'image floutée</p>
              <img
                src="./assets/img/voile.jpg"
                alt="Image de voile"
                class="img-fluid"
              />
            </div>
          </div>
        </div>
      </section> -->
    </main>
    <footer>
      <div class="container py-4">
        <div class="row mx-2">
          <div class="col-12">
            <div class="footer-header">
              <div
                class="footer-title d-flex justify-content-center align-items-center gap-2"
              >
                <img
                  src="./assets/img/logo-la-brigante.jpeg"
                  alt="Logo de la Brigante"
                  width="40"
                  class="img-fluid logo-la-brigante"
                />
                <p class="mb-0">La Brigante</p>
              </div>
              <div
                class="footer-reseaux d-flex justify-content-center align-items-center gap-3 mt-2"
              >
                <img
                  src="./assets/img/icon-instagram.svg"
                  alt="Instagram"
                  class="img-fluid logo-reseaux"
                />
                <img
                  src="./assets/img/icon-facebook.svg"
                  alt="Facebook"
                  class="img-fluid logo-reseaux"
                />
                <img
                  src="./assets/img/icon-google.svg"
                  alt="Google"
                  class="img-fluid logo-reseaux"
                />
              </div>
            </div>
          </div>
        </div>
        <div class="row mx-2">
          <div class="col-12">
            <p class="copyright-text">
              &copy; 2026 La Brigante. Tous droits réservés.
            </p>
          </div>
        </div>
      </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
